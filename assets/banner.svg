<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Orb Gradients -->
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Animated Gradient for Text & Borders -->
    <linearGradient id="shine-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#a855f7;#38bdf8;#34d399;#60a5fa" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#34d399;#60a5fa;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#34d399;#60a5fa;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Badge Background Gradient -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-1deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.08); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes badgeBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .floating-1 { animation: floatSlow 6s ease-in-out infinite; }
    .floating-2 { animation: floatReverse 7s ease-in-out infinite; }
    .floating-3 { animation: floatSlow 8s ease-in-out infinite 1s; }
    .pulse-orb-1 { animation: pulseGlow 5s ease-in-out infinite; transform-origin: 220px 120px; }
    .pulse-orb-2 { animation: pulseGlow 6s ease-in-out infinite 1.5s; transform-origin: 1000px 300px; }
    .animated-border { stroke-dasharray: 6, 6; animation: dashMove 4s linear infinite; }
    .badge-float { animation: badgeBounce 4s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Animated Glowing Orbs -->
  <circle cx="220" cy="120" r="180" fill="url(#glow-purple)" class="pulse-orb-1" />
  <circle cx="1000" cy="300" r="220" fill="url(#glow-cyan)" class="pulse-orb-2" />
  <circle cx="600" cy="210" r="260" fill="url(#glow-blue)" opacity="0.25" />

  <!-- Subtle Decorative Flow Lines -->
  <path d="M 50 350 Q 300 280, 600 340 T 1150 260" fill="none" stroke="url(#shine-grad)" stroke-width="1.5" stroke-opacity="0.4" class="animated-border" />
  <path d="M 80 80 Q 400 160, 750 70 T 1120 140" fill="none" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.3" class="animated-border" />

  <!-- Floating UI Mockup Elements -->
  <!-- Tooltip Box Top Right -->
  <g class="floating-1" transform="translate(860, 45)">
    <rect width="260" height="75" rx="10" fill="url(#badge-grad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" />
    <circle cx="28" cy="28" r="12" fill="#0284c7" />
    <text x="28" y="33" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">1</text>
    <text x="50" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Product Tour Step</text>
    <text x="50" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Click here to explore features &#x1F680;</text>
    <rect x="185" y="48" width="60" height="18" rx="4" fill="#38bdf8" />
    <text x="215" y="61" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Next &#x2192;</text>
  </g>

  <!-- Checklist Box Bottom Left -->
  <g class="floating-2" transform="translate(70, 260)">
    <rect width="250" height="110" rx="10" fill="url(#badge-grad)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.7" />
    <text x="20" y="28" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">&#x2728; Getting Started Checklist</text>
    <!-- Item 1 -->
    <circle cx="28" cy="50" r="7" fill="#22c55e" />
    <path d="M 25 50 L 27 52 L 31 47" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="44" y="54" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Create your first modal</text>
    <!-- Item 2 -->
    <circle cx="28" cy="74" r="7" fill="#22c55e" />
    <path d="M 25 74 L 27 76 L 31 71" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="44" y="78" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Build interactive walkthrough</text>
    <!-- Item 3 -->
    <circle cx="28" cy="96" r="6.5" fill="none" stroke="#64748b" stroke-width="1.5" />
    <text x="44" y="100" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Boost activation &amp; adoption</text>
  </g>

  <!-- Feature Badge Bottom Right -->
  <g class="floating-3" transform="translate(900, 275)">
    <rect width="230" height="90" rx="10" fill="url(#badge-grad)" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.7" />
    <text x="20" y="30" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">&#x26A1; Fast Integration</text>
    <text x="20" y="52" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">SaaS Platforms + Open Source</text>
    <text x="20" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">React &#x2022; Vue &#x2022; Angular &#x2022; Vanilla JS</text>
  </g>

  <!-- Central Content -->
  <g transform="translate(600, 155)" text-anchor="middle">
    <!-- Top Pill / Tag -->
    <rect x="-140" y="-85" width="280" height="32" rx="16" fill="#1e293b" stroke="url(#shine-grad)" stroke-width="1.2" />
    <text x="0" y="-64" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">&#x1F31F; CURATED ECOSYSTEM 2026</text>

    <!-- Main Title -->
    <text x="0" y="-10" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">Awesome User Onboarding</text>
    
    <!-- Shiny Subtitle -->
    <text x="0" y="32" fill="url(#shine-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700">In-App Product Tours &#x2022; Checklists &#x2022; Tooltips &#x2022; Digital Adoption</text>

    <!-- Description -->
    <text x="0" y="66" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">The definitive directory of top SaaS platforms and open-source GitHub tour libraries</text>

    <!-- Category Pills -->
    <g transform="translate(0, 105)">
      <!-- Pill 1 -->
      <rect x="-240" y="0" width="110" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="-185" y="17" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">&#x1F3AF; SaaS Tools</text>

      <!-- Pill 2 -->
      <rect x="-115" y="0" width="125" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="-52" y="17" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">&#x1F4BB; Open Source</text>

      <!-- Pill 3 -->
      <rect x="25" y="0" width="105" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="77" y="17" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">&#x1F916; AI Guides</text>

      <!-- Pill 4 -->
      <rect x="145" y="0" width="105" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="197" y="17" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">&#x1F4C8; Analytics</text>
    </g>
  </g>

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
